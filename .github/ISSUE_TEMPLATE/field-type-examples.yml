name: Field Types Example
description: Reference template demonstrating every GitHub issue form field type and attribute
title: "[EXAMPLE] <title>"
labels: ["example", "documentation"]
# assignees and projects are optional top-level keys (org/repo dependent)
assignees:
  - octocat
projects:
  - octo-org/1
body:
  # ----------------------------------------------------------------------------
  # 1. markdown — display-only text. Renders to the form but is NOT submitted
  #    and is NOT included in the resulting issue. Has no `id` and no validations.
  # ----------------------------------------------------------------------------
  - type: markdown
    attributes:
      value: |
        ## Welcome 👋
        Thanks for opening an issue! This template exists to demonstrate **every**
        field type and attribute supported by GitHub issue forms.

        > You can use any GitHub-flavored markdown here: lists, tables, images, etc.

  # ----------------------------------------------------------------------------
  # 2. input — single-line text field.
  #    attributes: label (req), description, placeholder, value
  #    validations: required
  # ----------------------------------------------------------------------------
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
      # NOTE: `value` (prefilled text) is optional, but if present it must be a
      # non-empty string. Omit it entirely rather than setting value: "".
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: What version are you running?
      placeholder: ex. 1.4.2
    validations:
      required: true

  # ----------------------------------------------------------------------------
  # 3. textarea — multi-line text field.
  #    attributes: label (req), description, placeholder, value,
  #                render (syntax-highlight as a code block; disables markdown)
  #    validations: required
  # ----------------------------------------------------------------------------
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output.
        This will be automatically formatted into code, so no need for backticks.
      render: shell
    validations:
      required: false

  # ----------------------------------------------------------------------------
  # 4. dropdown — select menu.
  #    attributes: label (req), description, multiple (allow multi-select),
  #                options (req — list of strings), default (index into options)
  #    validations: required
  #    NOTE: option values cannot be empty strings.
  # ----------------------------------------------------------------------------
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers are you seeing the problem on?
      description: Select all that apply.
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this issue?
      multiple: false
      default: 0    # pre-selects the first option (Low)
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  # ----------------------------------------------------------------------------
  # 5. checkboxes — set of checkboxes.
  #    attributes: label (req), description,
  #                options (req — each has `label` (req) and optional `required`)
  #    NOTE: per-checkbox `required: true` forces that single box to be checked.
  #          option labels support inline markdown (links, bold, etc.).
  # ----------------------------------------------------------------------------
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
        - label: I have searched the existing issues
          required: true
        - label: I would be willing to submit a PR to fix this
          required: false
