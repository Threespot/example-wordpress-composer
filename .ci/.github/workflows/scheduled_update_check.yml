name: Schedule update check

# Runs the Pantheon Composer Lock Updater nightly. Mirrors the
# (currently disabled) scheduled_update_check workflow in CircleCI.

on:
  schedule:
    - cron: '0 0 * * *'

defaults:
  run:
    shell: bash

env:
  TZ: "/usr/share/zoneinfo/America/New_York"
  TERM: dumb
  TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
  TERMINUS_SITE: ${{ secrets.TERMINUS_SITE }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  scheduled_update_check:
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
      options: --user root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup-environment-vars
        run: /build-tools-ci/scripts/set-environment

      - name: Authenticate with Terminus
        run: terminus -n auth:login --machine-token="$TERMINUS_TOKEN"

      - name: run composer lock updater
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          set -e && terminus project:clu "$TERMINUS_SITE"
