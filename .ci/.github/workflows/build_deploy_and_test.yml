name: Build, deploy and test

# This workflow mirrors .circleci/config.yml. It is not enabled by default —
# copy this file to .github/workflows/ and add the secrets listed in README.md
# under "Github Actions" to switch CI providers.

on: push

defaults:
  run:
    shell: bash

env:
  TZ: "/usr/share/zoneinfo/America/New_York"
  TERM: dumb
  ADMIN_USERNAME: admin
  NOTIFY: 'scripts/github/add-commit-comment {project} {sha} "Created multidev environment [{site}#{env}]({dashboard-url})." {site-url}'
  ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
  TERMINUS_SITE: ${{ secrets.TERMINUS_SITE }}
  TEST_SITE_NAME: ${{ secrets.TERMINUS_SITE }}
  DEFAULT_SITE: ${{ secrets.TERMINUS_SITE }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  CI_BUILD_NUMBER: ${{ github.run_number }}
  CI_PROJECT_NAME: ${{ github.repository }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  COMMIT_SHA: ${{ github.sha }}
  BASH_ENV: "./bash_env.txt"

jobs:
  configure_env_vars:
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
      options: --user root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set CI_BRANCH and PR metadata
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            export CI_BRANCH="${{ github.event.repository.default_branch }}"
          else
            export CI_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            export PR_NUMBER="${{ github.event.pull_request.number }}"
            export CI_PULL_REQUEST="${{ github.event.pull_request.html_url }}"
          fi
          export CI_PROJECT_USERNAME="${GITHUB_REPOSITORY_OWNER}"
          export CI_PROJECT_REPONAME="${GITHUB_REPOSITORY##*/}"
          /build-tools-ci/scripts/set-environment
          {
            echo "export CI_BUILD_URL='https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}'"
            echo "export CI_NODE_INDEX=0"
            echo "export CI_REPOSITORY_URL='https://github.com/${GITHUB_REPOSITORY}'"
          } >> "$BASH_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: bash_env
          path: bash_env.txt

  static_tests:
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
      options: --user root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: setup-environment-vars
        run: /build-tools-ci/scripts/set-environment

      - name: run static tests
        run: ./.ci/test/static/run

  build_yarn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: yarn
          cache-dependency-path: web/wp-content/themes/sage/yarn.lock

      - name: install theme yarn dependencies
        working-directory: web/wp-content/themes/sage
        run: yarn install --frozen-lockfile

      - name: build theme assets
        working-directory: web/wp-content/themes/sage
        run: yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: sage-public
          path: web/wp-content/themes/sage/public

  build_php:
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
      options: --user root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-vendor-${{ hashFiles('composer.lock') }}

      - name: setup-environment-vars
        run: /build-tools-ci/scripts/set-environment

      - name: run PHP build step
        run: ./.ci/build/php

      # Sage theme composer dependencies (matches .circleci/config.yml).
      # Uses --ignore-platform-req=ext-redis for Object Cache Pro:
      # https://docs.pantheon.io/object-cache/wordpress
      - name: install theme composer dependencies
        working-directory: web/wp-content/themes/sage
        run: composer install --ignore-platform-req=ext-redis --no-interaction --optimize-autoloader

      - uses: actions/upload-artifact@v4
        with:
          name: php-build
          path: |
            web
            vendor

  deploy_to_pantheon:
    container:
      image: quay.io/pantheon-public/build-tools-ci:8.x-php8.3
      options: --user root
    runs-on: ubuntu-latest
    needs: [configure_env_vars, static_tests, build_yarn, build_php]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: bash_env

      - uses: actions/download-artifact@v4
        with:
          name: php-build

      - uses: actions/download-artifact@v4
        with:
          name: sage-public
          path: web/wp-content/themes/sage/public

      - name: setup-environment-vars
        run: /build-tools-ci/scripts/set-environment

      - name: deploy to Pantheon
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          source "$BASH_ENV"
          ./.ci/deploy/pantheon/dev-multidev
